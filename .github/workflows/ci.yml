name: VelarScript Website CI

on:
  push:
  pull_request:

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          path: website
      - uses: actions/checkout@v6
        with:
          repository: VelarOS-AI/VelarScript
          ref: 70cd78213b0717925f3f9c89281b8fa1241dda13
          path: toolchain
      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: toolchain/package-lock.json
      - run: npm ci
        working-directory: toolchain
      - run: npm run bootstrap:local -- ../toolchain
        working-directory: website
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: website
      - run: npm run validate
        working-directory: website
      - run: npm run deploy:prepare
        working-directory: website
      - run: npm run deploy:smoke
        working-directory: website
      - run: npm run test:browser:all
        working-directory: website
      - uses: actions/attest@v4
        with:
          subject-path: website/release/deployment/site/velar-build.json
      - uses: actions/upload-artifact@v7
        with:
          name: velarscript-website-self-hosted-${{ github.sha }}
          path: website/release/deployment/site
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
